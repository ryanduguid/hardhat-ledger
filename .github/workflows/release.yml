name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  refuse-frozen:
    if: github.ref_name == 'v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: v0.1.0 is frozen
        run: |
          echo "v0.1.0 is frozen and must never be rebuilt or replaced." >&2
          exit 1
  release:
    if: github.ref_name != 'v0.1.0'
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-archive.yml@47480b782926179b621ec1c6643ef88c80fc8fd4
    with:
      artifact-stem: subcontractor-accounting-skills
